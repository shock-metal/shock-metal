# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Release

# Triggered when you push a version tag such as v4.0.0 or v4.0.0-1.21.1
on:
  push:
    tags:
      - 'v*'

# Required to create GitHub Releases and upload assets
permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Attach the built mod JAR(s) from build/libs
          files: build/libs/*.jar
          # Auto-generate release notes from merged PRs and commits since last tag
          generate_release_notes: true
          draft: false
          prerelease: false
